---
- name: Configure common baseline on all hosts
  hosts: all
  become: true
  roles:
    - role: common
      tags: [common]

- name: Configure frontend (Nginx)
  hosts: frontend
  become: true
  roles:
    - role: frontend
      tags: [frontend]

- name: Configure backend (EpicBook and database)
  hosts: backend
  become: true
  roles:
    - role: backend
      tags: [backend]
    - role: database
      tags: [database]
  post_tasks:
    - name: Ensure the EpicBook service is running
      ansible.builtin.systemd:
        name: epicbook
        state: started
      tags: [backend, database]

- name: Verify backend service and database
  hosts: backend
  become: true
  tags: [verify]
  tasks:
    - name: Confirm the epicbook service is active
      ansible.builtin.systemd:
        name: epicbook
      register: epicbook_status
      failed_when: epicbook_status.status.ActiveState != "active"

    - name: Confirm the backend port is listening
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ backend_app_port }}"
        timeout: 15

    - name: Count the Author rows
      community.mysql.mysql_query:
        login_host: "{{ mysql_fqdn }}"
        login_user: "{{ db_admin_username }}"
        login_password: "{{ db_admin_password }}"
        login_db: "{{ db_name }}"
        query: "SELECT COUNT(*) AS row_count FROM Author"
      register: verify_author_count
      no_log: true

    - name: Fail if the Author table is empty
      ansible.builtin.fail:
        msg: "Author table has no rows. The seed import may have failed."
      when: verify_author_count.query_result[0][0].row_count == 0

    - name: Count the Book rows
      community.mysql.mysql_query:
        login_host: "{{ mysql_fqdn }}"
        login_user: "{{ db_admin_username }}"
        login_password: "{{ db_admin_password }}"
        login_db: "{{ db_name }}"
        query: "SELECT COUNT(*) AS row_count FROM Book"
      register: verify_book_count
      no_log: true

    - name: Fail if the Book table is empty
      ansible.builtin.fail:
        msg: "Book table has no rows. The seed import may have failed."
      when: verify_book_count.query_result[0][0].row_count == 0

- name: Verify frontend and end-to-end connectivity
  hosts: frontend
  become: true
  tags: [verify]
  tasks:
    - name: Confirm Nginx is active
      ansible.builtin.systemd:
        name: nginx
      register: nginx_status
      failed_when: nginx_status.status.ActiveState != "active"

    - name: Confirm the Nginx configuration is valid
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Request the frontend through Nginx to the backend
      ansible.builtin.uri:
        url: "http://localhost/"
        status_code: 200
        timeout: 15
      register: frontend_response

    - name: Report verification success
      ansible.builtin.debug:
        msg: "Frontend answered HTTP {{ frontend_response.status }}. EpicBook is reachable end to end."
