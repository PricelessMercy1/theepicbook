---
- name: Configure common baseline on all hosts
  hosts: all
  become: true
  roles:
    - role: common
      tags: [common]

- name: Configure frontend (Nginx)
  hosts: frontend
  become: true
  roles:
    - role: frontend
      tags: [frontend]

- name: Configure backend (EpicBook and database)
  hosts: backend
  become: true
  roles:
    - role: backend
      tags: [backend]
    - role: database
      tags: [database]
  post_tasks:
    - name: Ensure the EpicBook service is running
      ansible.builtin.systemd:
        name: epicbook
        state: started
      tags: [backend, database]
